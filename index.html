<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vacances 2026 — le vote 🏖️</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏖️</text></svg>">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="head-row">
      <h1>🏖️ Vacances 2026 — on vote !</h1>
      <div class="me">
        <label for="me-name">Je suis</label>
        <input id="me-name" type="text" placeholder="ton prénom" maxlength="20">
      </div>
    </div>
    <p class="sub">Semaine du 1<sup>er</sup>–9 août · 7 adultes + 4 enfants · budget ~4 500 €.
      ❤️ vote pour tes préférés, 📝 laisse des notes, puis <button class="linklike" id="btn-share">partage ton vote</button> aux autres.</p>
  </header>

  <nav class="toolbar">
    <div class="chips" id="region-chips"></div>
    <div class="tools">
      <select id="sort">
        <option value="votes">Tri : ❤️ votes</option>
        <option value="price">Tri : prix ↑</option>
        <option value="rating">Tri : note Airbnb</option>
      </select>
      <button id="btn-view-map" class="btn">🗺️ Carte</button>
    </div>
  </nav>

  <div id="map-wrap" class="hidden"><div id="map"></div></div>
  <main id="cards"></main>

  <footer>
    <span id="stats"></span> ·
    <button class="linklike danger" id="btn-reset">Réinitialiser mes votes/notes</button>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <script src="listings.js"></script>
  <script src="app.js"></script>
</body>
</html>
